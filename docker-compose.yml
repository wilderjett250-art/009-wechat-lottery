services:
  mysql:
    image: mysql:8.4
    container_name: lottery-tool-mysql
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lottery_tool}
      - MYSQL_USER=${MYSQL_USER:-lottery_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me-before-production}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me-before-production-root}
    volumes:
      - lottery-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  lottery-tool:
    build: .
    container_name: lottery-tool
    restart: always
    environment:
      - PORT=5177
      - HOST=0.0.0.0
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_SESSION_LIFETIME_MS=${ADMIN_SESSION_LIFETIME_MS:-28800000}
      - MINIPROGRAM_LAUNCH_URL=${MINIPROGRAM_LAUNCH_URL:-}
      - WECHAT_APPID=${WECHAT_APPID:-wxexampleappid0001}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_DRAW_TEMPLATE_ID=${WECHAT_DRAW_TEMPLATE_ID:-}
      - WECHAT_DRAW_REMINDER_TEMPLATE_ID=${WECHAT_DRAW_REMINDER_TEMPLATE_ID:-}
      - WECHAT_CASH_TEMPLATE_ID=${WECHAT_CASH_TEMPLATE_ID:-}
      - WECHAT_COMMENT_TEMPLATE_ID=${WECHAT_COMMENT_TEMPLATE_ID:-}
      - WECHAT_DRAW_TEMPLATE_DATA=${WECHAT_DRAW_TEMPLATE_DATA:-}
      - WECHAT_DRAW_REMINDER_TEMPLATE_DATA=${WECHAT_DRAW_REMINDER_TEMPLATE_DATA:-}
      - WECHAT_CASH_TEMPLATE_DATA=${WECHAT_CASH_TEMPLATE_DATA:-}
      - WECHAT_COMMENT_TEMPLATE_DATA=${WECHAT_COMMENT_TEMPLATE_DATA:-}
      - WECHAT_NOTIFY_PAGE=${WECHAT_NOTIFY_PAGE:-pages/records/records}
      - WECHAT_MINIPROGRAM_STATE=${WECHAT_MINIPROGRAM_STATE:-formal}
      - NOTIFICATION_MAX_ATTEMPTS=${NOTIFICATION_MAX_ATTEMPTS:-5}
      - NOTIFICATION_RETRY_DELAYS_MS=${NOTIFICATION_RETRY_DELAYS_MS:-60000,300000,1800000,7200000}
      - SESSION_LIFETIME_MS=${SESSION_LIFETIME_MS:-2592000000}
      - MAX_STORED_SESSIONS=${MAX_STORED_SESSIONS:-10000}
      - LOGIN_RATE_LIMIT_WINDOW_MS=${LOGIN_RATE_LIMIT_WINDOW_MS:-600000}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-20}
      - ACTIVITY_ACTION_RATE_LIMIT_WINDOW_MS=${ACTIVITY_ACTION_RATE_LIMIT_WINDOW_MS:-60000}
      - ACTIVITY_ACTION_RATE_LIMIT_MAX=${ACTIVITY_ACTION_RATE_LIMIT_MAX:-90}
      - WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID:-}
      - WECHAT_PAY_SERIAL_NO=${WECHAT_PAY_SERIAL_NO:-}
      - WECHAT_PAY_PRIVATE_KEY_PATH=${WECHAT_PAY_PRIVATE_KEY_PATH:-/app/secrets/apiclient_key.pem}
      - WECHAT_PAY_API_V3_KEY=${WECHAT_PAY_API_V3_KEY:-}
      - WECHAT_PAY_PLATFORM_SERIAL_NO=${WECHAT_PAY_PLATFORM_SERIAL_NO:-}
      - WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH=${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-/app/secrets/wechatpay_platform.pem}
      - WECHAT_PAY_NOTIFY_URL=${WECHAT_PAY_NOTIFY_URL:-https://lottery.example.com/api/payments/wechat/notify}
      - ADVANCED_FEATURE_PRICE_CENTS=${ADVANCED_FEATURE_PRICE_CENTS:-0}
      - OFFICIAL_ACCOUNT_APPID=${OFFICIAL_ACCOUNT_APPID:-}
      - OFFICIAL_ACCOUNT_APP_SECRET=${OFFICIAL_ACCOUNT_APP_SECRET:-}
      - OFFICIAL_ACCOUNT_TOKEN=${OFFICIAL_ACCOUNT_TOKEN:-}
      - OFFICIAL_ACCOUNT_NAME=${OFFICIAL_ACCOUNT_NAME:-}
      - OFFICIAL_ACCOUNT_USERNAME=${OFFICIAL_ACCOUNT_USERNAME:-}
      - WECHAT_OPEN_COMPONENT_APPID=${WECHAT_OPEN_COMPONENT_APPID:-}
      - WECHAT_OPEN_COMPONENT_APP_SECRET=${WECHAT_OPEN_COMPONENT_APP_SECRET:-}
      - WECHAT_OPEN_COMPONENT_TOKEN=${WECHAT_OPEN_COMPONENT_TOKEN:-}
      - WECHAT_OPEN_COMPONENT_AES_KEY=${WECHAT_OPEN_COMPONENT_AES_KEY:-}
      - WECHAT_OPEN_PUBLIC_BASE_URL=${WECHAT_OPEN_PUBLIC_BASE_URL:-https://lottery.example.com}
      - WECHAT_OPEN_AUTH_REDIRECT_URL=${WECHAT_OPEN_AUTH_REDIRECT_URL:-https://lottery.example.com/api/wechat/open-platform/authorization/callback}
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_CONTACT_SECRET=${WECOM_CONTACT_SECRET:-}
      - WECOM_NAME=${WECOM_NAME:-}
      - DRAW_SCHEDULER_INTERVAL_MS=${DRAW_SCHEDULER_INTERVAL_MS:-30000}
      - DRAW_REMINDER_LEAD_MS=${DRAW_REMINDER_LEAD_MS:-1800000}
      - RELEASE_VERSION=${RELEASE_VERSION:-1.4.5}
      - DATA_DIR=/app/data
      - DATABASE_URL=mysql://${MYSQL_USER:-lottery_app}:${MYSQL_PASSWORD:-change-me-before-production}@mysql:3306/${MYSQL_DATABASE:-lottery_tool}
      - HIDE_SAMPLE_DATA=${HIDE_SAMPLE_DATA:-false}
    ports:
      - "127.0.0.1:5177:5177"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  lottery-mysql-data:
