<!doctype html>

    <title>抽奖工具后台登录</title>

  </head>
  <body class="entry-page">
    <main class="entry-shell admin-login-shell">
      <section class="entry-hero">
        <p class="entry-kicker">运营后台</p>
        <h1>抽奖工具</h1>

          <span>后台访问密钥</span>
          <input name="token" type="password" autocomplete="current-password" required />

        <button class="btn" type="submit">安全登录</button>
        <p id="adminLoginMessage" class="entry-hint" role="status"></p>
      </form>

    <script src="/admin-login.js?v=20260727-entry" type="module"></script>
